[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gsrfs"
version = "0.16.0"
description = "Research prototype for geometry-supported residual unsupervised feature selection"
keywords = ["feature-selection", "unsupervised-learning", "machine-learning", "dimensionality-reduction", "scikit-learn"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0"
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
test = ["pytest>=8"]
benchmark = ["openml>=0.15", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gsrfs-select = "gsrfs.cli:main"
